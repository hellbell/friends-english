name: Publish English study app

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/configure-pages@v5
      - name: Build password-locked app and refresh video recommendations
        env:
          FE_PAGES_KEY: ${{ secrets.PAGES_KEY }}  # without it the build stops and nothing is deployed
          FE_NOTES_SYNC: ${{ secrets.NOTES_SYNC }}  # optional: 'owner/repo token' for syncing saved notes
        run: python3 build_pages.py --refresh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
